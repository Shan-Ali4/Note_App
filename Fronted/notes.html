<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* ==========================================
           NOTES APP - MODERN & RESPONSIVE CSS
           ========================================== */

        /* Import Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap');

        /* ==========================================
           ROOT VARIABLES & GLOBAL STYLES
           ========================================== */

        :root {
            --primary-color: #5b21b6;
            --primary-light: #7c3aed;
            --primary-dark: #4c1d95;
            --secondary-color: #0891b2;
            --secondary-light: #06b6d4;
            --danger-color: #dc2626;
            --danger-light: #ef4444;
            --success-color: #16a34a;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-light: #9ca3af;
            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --bg-tertiary: #f3f4f6;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            color: var(--text-primary);
            line-height: 1.6;
            letter-spacing: 0.3px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        .content-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex: 1;
            padding: 2rem 1rem;
            flex-direction: column;
            width: 100%;
        }

        /* ==========================================
           TYPOGRAPHY
           ========================================== */

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2rem;
            text-align: center;
            letter-spacing: -0.5px;
        }

        h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        p, small {
            color: var(--text-secondary);
            font-size: 0.95rem;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        /* ==========================================
           NOTES CONTAINER & GRID
           ========================================== */

        #notes-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin: 2rem auto;
            max-width: 1200px;
            width: 100%;
            padding: 0 1rem;
        }

        /* Empty State Message */
        #notes-container p {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-light);
            padding: 3rem 1rem;
        }

        /* ==========================================
           NOTE CARD STYLES
           ========================================== */

        .note {
            background: var(--bg-primary);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .note:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
            border-color: var(--primary-light);
        }

        .note h2 {
            color: var(--text-primary);
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 0.75rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .note p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0.75rem 0;
            flex-grow: 1;
            word-break: break-word;
        }

        .note small {
            color: var(--text-light);
            font-size: 0.85rem;
            font-weight: 500;
            background: var(--bg-tertiary);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            display: inline-block;
            margin: 0.75rem 0 0 0;
        }

        /* ==========================================
           NOTE CARD BUTTONS
           ========================================== */

        .note button {
            padding: 0.5rem 1rem;
            margin-left: 0.5rem;
            margin-bottom: 0;
            margin-top: 1rem;
            font-size: 0.85rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            text-transform: capitalize;
            letter-spacing: 0.3px;
            display: inline-block;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .note button:first-of-type {
            background: var(--secondary-light);
            color: white;
        }

        .note button:first-of-type:hover {
            background: var(--secondary-color);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .note button:last-of-type {
            background: var(--danger-light);
            color: white;
        }

        .note button:last-of-type:hover {
            background: var(--danger-color);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        /* ==========================================
           FORM STYLES FOR EDIT
           ========================================== */

        form {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        form label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        form input[type="text"],
        form textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: var(--text-primary);
            background-color: var(--bg-tertiary);
            transition: var(--transition);
        }

        form input[type="text"]:focus,
        form textarea:focus {
            border-color: var(--primary-light);
            background-color: var(--bg-primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
            outline: none;
        }

        form button[type="submit"] {
            background: var(--success-color);
            color: white;
            padding: 0.75rem 1.5rem;
            width: 100%;
            border-radius: 8px;
            font-weight: 600;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
        }

        form button[type="submit"]:hover {
            background: #15803d;
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        form button[type="submit"]:active {
            transform: translateY(0);
        }

        /* ==========================================
           RESPONSIVE DESIGN - TABLET
           ========================================== */

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 1.5rem;
            }

            #notes-container {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 1.5rem;
                max-width: 100%;
                padding: 0 0.5rem;
                margin: 1.5rem auto;
            }

            .note {
                padding: 1.25rem;
                border-radius: 10px;
            }

            .note h2 {
                font-size: 1.2rem;
            }
        }

        /* ==========================================
           RESPONSIVE DESIGN - MOBILE
           ========================================== */

        @media (max-width: 480px) {
            h1 {
                font-size: 1.75rem;
                margin: 1rem 0 1.5rem 0;
            }

            #notes-container {
                grid-template-columns: 1fr;
                gap: 1rem;
                max-width: 100%;
                padding: 0;
                margin: 1rem auto;
            }

            .note {
                padding: 1rem;
                border-radius: 10px;
            }

            .note h2 {
                font-size: 1.1rem;
                margin-bottom: 0.5rem;
            }

            .note p {
                font-size: 0.9rem;
            }

            .note button {
                padding: 0.5rem 0.75rem;
                font-size: 0.8rem;
                margin-left: 0.25rem;
            }
        }

        /* ==========================================
           ACCESSIBILITY
           ========================================== */

        input:focus-visible,
        textarea:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--primary-light);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ==========================================
           NAVBAR HEADER
           ========================================== */

        .navbar {
            background: var(--bg-primary);
            box-shadow: var(--shadow-md);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            transition: var(--transition);
        }

        .navbar-brand:hover {
            transform: scale(1.05);
        }

        .navbar-logo {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 0.75rem 1rem;
            }

            .navbar-logo {
                width: 40px;
                height: 40px;
            }

            .navbar-title {
                font-size: 1.2rem;
            }
        }
    </style>
    <title>Notes</title>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <div class="navbar-logo">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" />
                    <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
                    <rect x="55" y="45" width="90" height="110" rx="8" fill="white" opacity="0.95" />
                    <rect x="55" y="45" width="6" height="110" rx="3" fill="#06b6d4" />
                    <line x1="70" y1="65" x2="125" y2="65" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" />
                    <line x1="70" y1="80" x2="135" y2="80" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
                    <line x1="70" y1="92" x2="135" y2="92" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
                    <line x1="70" y1="104" x2="135" y2="104" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
                    <line x1="70" y1="116" x2="120" y2="116" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
                    <line x1="70" y1="128" x2="130" y2="128" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
                    <g transform="translate(140, 55)">
                        <rect x="-8" y="0" width="6" height="35" rx="2" fill="#06b6d4" />
                        <polygon points="0,35 -6,45 6,45" fill="#06b6d4" />
                        <rect x="-9" y="-5" width="8" height="6" rx="1" fill="#7c3aed" />
                    </g>
                    <circle cx="85" cy="155" r="2.5" fill="rgba(255,255,255,0.6)" />
                    <circle cx="100" cy="158" r="2.5" fill="rgba(255,255,255,0.6)" />
                    <circle cx="115" cy="155" r="2.5" fill="rgba(255,255,255,0.6)" />
                </svg>
            </div>
            <span class="navbar-title">NotesHub</span>
        </a>
    </nav>
    <div class="content-wrapper">
    <h1>My Notes</h1>
    <div id="notes-container"></div>
    </div>
</body>
<script>
    const notesContainer = document.getElementById('notes-container');

    // Function to create a note element
    function createNoteElement(note) {
        const noteElem = document.createElement('div');
        noteElem.classList.add('note');

        const titleElem = document.createElement('h2');
        titleElem.innerText = note.title;
        noteElem.appendChild(titleElem);

        const bodyElem = document.createElement('p');
        bodyElem.innerText = note.body;
        noteElem.appendChild(bodyElem);

        const subElem = document.createElement('small');
        subElem.innerText = note.sub;
        noteElem.appendChild(subElem);

        const editButton = document.createElement('button');
        editButton.innerText = 'Edit';
        editButton.addEventListener('click', () => {
            const editForm = document.createElement('form');
            editForm.innerHTML = `
                <label for="title">Title:</label>
                <input type="text" name="title" value="${note.title}" required><br>
                <label for="body">Body:</label>
                <textarea name="body" required>${note.body}</textarea><br>
                <label for="sub">Sub:</label>
                <input type="text" name="sub" value="${note.sub}" required><br>
                <button type="submit">Save</button>
            `;
            noteElem.replaceWith(editForm);

            editForm.addEventListener('submit', (event) => {
                event.preventDefault();

                const formData = new FormData(event.target);
                const updatedNote = {
                    title: formData.get('title'),
                    body: formData.get('body'),
                    sub: formData.get('sub')
                };

                fetch(`http://localhost:4500/notes/update/${note._id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': localStorage.getItem('token')
                    },
                    body: JSON.stringify(updatedNote)
                })
                    .then(res => res.json())
                    .then(res => {
                        // Update the note object with new values
                        note.title = res.title || note.title;
                        note.body = res.body || note.body;
                        note.sub = res.sub || note.sub;
                        
                        const updatedNoteElem = createNoteElement(note);
                        editForm.replaceWith(updatedNoteElem);
                        alert("Note updated successfully!");
                    })
                    .catch(err => {
                        console.error(err);
                        alert("Error updating note");
                    });
            });
        });
        noteElem.appendChild(editButton);

        const deleteButton = document.createElement('button');
        deleteButton.innerText = 'Delete';
        deleteButton.addEventListener('click', () => {
            fetch(`http://localhost:4500/notes/delete/${note._id}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': localStorage.getItem('token')
                }
            })
                .then(res => res.json())
                .then(res => {
                    noteElem.remove();
                    alert("Note deleted successfully!");
                })
                .catch(err => {
                    console.error(err);
                    alert("Error deleting note");
                });
        });
        noteElem.appendChild(deleteButton);

        return noteElem;
    }

    // Fetch and display notes
    fetch('http://localhost:4500/notes', {
        headers: {
            'Authorization': localStorage.getItem('token')
        }
    })
        .then(res => res.json())
        .then(notes => {
            if (notes && notes.length > 0) {
                notes.forEach(note => {
                    const noteElem = createNoteElement(note);
                    notesContainer.appendChild(noteElem);
                });
            } else {
                notesContainer.innerHTML = '<p>No notes found. Create one to get started!</p>';
            }
        })
        .catch(err => {
            console.error(err);
            alert("Error fetching notes");
        });
</script>

</html>
