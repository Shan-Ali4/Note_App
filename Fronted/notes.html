<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Notes</title>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <div class="navbar-logo">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" />
                    <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
                    <rect x="55" y="45" width="90" height="110" rx="8" fill="white" opacity="0.95" />
                    <rect x="55" y="45" width="6" height="110" rx="3" fill="#06b6d4" />
                    <line x1="70" y1="65" x2="125" y2="65" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" />
                    <line x1="70" y1="80" x2="135" y2="80" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
                    <line x1="70" y1="92" x2="135" y2="92" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
                    <line x1="70" y1="104" x2="135" y2="104" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
                    <line x1="70" y1="116" x2="120" y2="116" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
                    <line x1="70" y1="128" x2="130" y2="128" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
                    <g transform="translate(140, 55)">
                        <rect x="-8" y="0" width="6" height="35" rx="2" fill="#06b6d4" />
                        <polygon points="0,35 -6,45 6,45" fill="#06b6d4" />
                        <rect x="-9" y="-5" width="8" height="6" rx="1" fill="#7c3aed" />
                    </g>
                    <circle cx="85" cy="155" r="2.5" fill="rgba(255,255,255,0.6)" />
                    <circle cx="100" cy="158" r="2.5" fill="rgba(255,255,255,0.6)" />
                    <circle cx="115" cy="155" r="2.5" fill="rgba(255,255,255,0.6)" />
                </svg>
            </div>
            <span class="navbar-title">NotesHub</span>
        </a>
    </nav>
    <div class="content-wrapper">
    <h1>My Notes</h1>
    <div id="notes-container"></div>
    </div>
</body>
<script>
    const notesContainer = document.getElementById('notes-container');

    // Function to create a note element
    function createNoteElement(note) {
        const noteElem = document.createElement('div');
        noteElem.classList.add('note');

        const titleElem = document.createElement('h2');
        titleElem.innerText = note.title;
        noteElem.appendChild(titleElem);

        const bodyElem = document.createElement('p');
        bodyElem.innerText = note.body;
        noteElem.appendChild(bodyElem);

        const subElem = document.createElement('small');
        subElem.innerText = note.sub;
        noteElem.appendChild(subElem);

        const editButton = document.createElement('button');
        editButton.innerText = 'Edit';
        editButton.addEventListener('click', () => {
            const editForm = document.createElement('form');
            editForm.innerHTML = `
                <label for="title">Title:</label>
                <input type="text" name="title" value="${note.title}" required><br>
                <label for="body">Body:</label>
                <textarea name="body" required>${note.body}</textarea><br>
                <label for="sub">Sub:</label>
                <input type="text" name="sub" value="${note.sub}" required><br>
                <button type="submit">Save</button>
            `;
            noteElem.replaceWith(editForm);

            editForm.addEventListener('submit', (event) => {
                event.preventDefault();

                const formData = new FormData(event.target);
                const updatedNote = {
                    title: formData.get('title'),
                    body: formData.get('body'),
                    sub: formData.get('sub')
                };

                fetch(`http://localhost:4500/notes/update/${note._id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': localStorage.getItem('token')
                    },
                    body: JSON.stringify(updatedNote)
                })
                    .then(res => res.json())
                    .then(res => {
                        // Update the note object with new values
                        note.title = res.title || note.title;
                        note.body = res.body || note.body;
                        note.sub = res.sub || note.sub;
                        
                        const updatedNoteElem = createNoteElement(note);
                        editForm.replaceWith(updatedNoteElem);
                        alert("Note updated successfully!");
                    })
                    .catch(err => {
                        console.error(err);
                        alert("Error updating note");
                    });
            });
        });
        noteElem.appendChild(editButton);

        const deleteButton = document.createElement('button');
        deleteButton.innerText = 'Delete';
        deleteButton.addEventListener('click', () => {
            fetch(`http://localhost:4500/notes/delete/${note._id}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': localStorage.getItem('token')
                }
            })
                .then(res => res.json())
                .then(res => {
                    noteElem.remove();
                    alert("Note deleted successfully!");
                })
                .catch(err => {
                    console.error(err);
                    alert("Error deleting note");
                });
        });
        noteElem.appendChild(deleteButton);

        return noteElem;
    }

    // Fetch and display notes
    fetch('http://localhost:4500/notes', {
        headers: {
            'Authorization': localStorage.getItem('token')
        }
    })
        .then(res => res.json())
        .then(notes => {
            if (notes && notes.length > 0) {
                notes.forEach(note => {
                    const noteElem = createNoteElement(note);
                    notesContainer.appendChild(noteElem);
                });
            } else {
                notesContainer.innerHTML = '<p>No notes found. Create one to get started!</p>';
            }
        })
        .catch(err => {
            console.error(err);
            alert("Error fetching notes");
        });
</script>

</html>
