<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ==========================================
       NOTES APP - MODERN & RESPONSIVE CSS
       ========================================== */

    /* Import Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap');

    /* ==========================================
       ROOT VARIABLES & GLOBAL STYLES
       ========================================== */

    :root {
        --primary-color: #5b21b6;
        --primary-light: #7c3aed;
        --primary-dark: #4c1d95;
        --secondary-color: #0891b2;
        --secondary-light: #06b6d4;
        --danger-color: #dc2626;
        --danger-light: #ef4444;
        --success-color: #16a34a;
        --text-primary: #1f2937;
        --text-secondary: #6b7280;
        --text-light: #9ca3af;
        --bg-primary: #ffffff;
        --bg-secondary: #f9fafb;
        --bg-tertiary: #f3f4f6;
        --border-color: #e5e7eb;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
        --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1);
        --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.12);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
        color: var(--text-primary);
        line-height: 1.6;
        letter-spacing: 0.3px;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 0;
        margin: 0;
    }

    .content-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 1;
        padding: 2rem 1rem;
    }

    /* ==========================================
       TYPOGRAPHY
       ========================================== */

    h1 {
        font-family: 'Poppins', sans-serif;
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 2rem;
        text-align: center;
        letter-spacing: -0.5px;
    }

    label {
        display: block;
        margin-bottom: 0.75rem;
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text-primary);
        transition: var(--transition);
    }

    label:hover {
        color: var(--primary-light);
    }

    /* ==========================================
       FORM CONTAINER
       ========================================== */

    form {
        background: var(--bg-primary);
        border-radius: 16px;
        padding: 2.5rem;
        width: 100%;
        max-width: 550px;
        box-shadow: var(--shadow-lg);
        transition: var(--transition);
        border: 1px solid var(--border-color);
    }

    form:hover {
        box-shadow: var(--shadow-xl);
    }

    /* ==========================================
       FORM INPUTS & TEXTAREA
       ========================================== */

    input[type="text"],
    textarea {
        width: 100%;
        padding: 0.875rem 1rem;
        margin-bottom: 1.5rem;
        border: 2px solid var(--border-color);
        border-radius: 10px;
        font-family: 'Inter', sans-serif;
        font-size: 0.95rem;
        color: var(--text-primary);
        background-color: var(--bg-tertiary);
        transition: var(--transition);
        outline: none;
        resize: vertical;
        min-height: 120px;
    }

    input[type="text"]:focus,
    textarea:focus {
        border-color: var(--primary-light);
        background-color: var(--bg-primary);
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        transform: translateY(-2px);
    }

    input[type="text"]::placeholder,
    textarea::placeholder {
        color: var(--text-light);
    }

    /* ==========================================
       SUBMIT BUTTON
       ========================================== */

    input[type="submit"] {
        width: 100%;
        padding: 0.875rem 1.5rem;
        margin-bottom: 1rem;
        border: none;
        border-radius: 10px;
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: var(--shadow-md);
        background: linear-gradient(135deg, var(--success-color), #15803d);
        color: white;
    }

    input[type="submit"]:hover {
        background: linear-gradient(135deg, #15803d, #166534);
        box-shadow: var(--shadow-lg);
        transform: translateY(-2px);
    }

    input[type="submit"]:active {
        transform: translateY(0);
        box-shadow: var(--shadow-md);
    }

    /* ==========================================
       VIEW NOTES LINK
       ========================================== */

    a {
        text-decoration: none;
        color: white;
        padding: 0.875rem 1.5rem;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--secondary-light), var(--secondary-color));
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: inline-block;
        transition: var(--transition);
        box-shadow: var(--shadow-md);
        width: 100%;
        text-align: center;
        margin-left: 0;
    }

    a:hover {
        background: linear-gradient(135deg, var(--secondary-color), #0e7490);
        box-shadow: var(--shadow-lg);
        transform: translateY(-2px);
    }

    a:active {
        transform: translateY(0);
    }

    /* ==========================================
       RESPONSIVE DESIGN - TABLET
       ========================================== */

    @media (max-width: 768px) {
        body {
            padding: 1rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }

        form {
            max-width: 100%;
            padding: 2rem;
        }

        input[type="submit"],
        a {
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
        }

        input[type="text"],
        textarea {
            padding: 0.75rem 0.875rem;
            font-size: 1rem;
        }
    }

    /* ==========================================
       RESPONSIVE DESIGN - MOBILE
       ========================================== */

    @media (max-width: 480px) {
        body {
            padding: 0.5rem;
            min-height: auto;
            align-items: flex-start;
        }

        h1 {
            font-size: 1.75rem;
            margin: 1rem 0 1.5rem 0;
        }

        form {
            max-width: 100%;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        label {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        input[type="text"],
        textarea {
            padding: 0.75rem 0.875rem;
            margin-bottom: 1rem;
            font-size: 1rem;
            border-radius: 8px;
        }

        input[type="submit"],
        a {
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            border-radius: 8px;
        }
    }

    /* ==========================================
       ACCESSIBILITY
       ========================================== */

    input:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
        outline: 2px solid var(--primary-light);
        outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
        * {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }

    /* ==========================================
       NAVBAR HEADER
       ========================================== */

    .navbar {
        background: var(--bg-primary);
        box-shadow: var(--shadow-md);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid var(--border-color);
    }

    .navbar-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        text-decoration: none;
        transition: var(--transition);
    }

    .navbar-brand:hover {
        transform: scale(1.05);
    }

    .navbar-logo {
        width: 35px;
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .navbar-title {
        font-family: 'Poppins', sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.5px;
    }

    @media (max-width: 600px) {
        .navbar {
            padding: 0.75rem 1rem;
        }

        .navbar-logo {
            width: 30px;
            height: 30px;
        }

        .navbar-title {
            font-size: 1.2rem;
        }
    }
  </style>
  </style>
  <title>Create Note</title>
</head>

<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="navbar-logo">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
          <defs>
            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1" />
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" />
          <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
          <rect x="55" y="45" width="90" height="110" rx="8" fill="white" opacity="0.95" />
          <rect x="55" y="45" width="6" height="110" rx="3" fill="#06b6d4" />
          <line x1="70" y1="65" x2="125" y2="65" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" />
          <line x1="70" y1="80" x2="135" y2="80" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
          <line x1="70" y1="92" x2="135" y2="92" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
          <line x1="70" y1="104" x2="135" y2="104" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
          <line x1="70" y1="116" x2="120" y2="116" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
          <line x1="70" y1="128" x2="130" y2="128" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
          <g transform="translate(140, 55)">
            <rect x="-8" y="0" width="6" height="35" rx="2" fill="#06b6d4" />
            <polygon points="0,35 -6,45 6,45" fill="#06b6d4" />
            <rect x="-9" y="-5" width="8" height="6" rx="1" fill="#7c3aed" />
          </g>
          <circle cx="85" cy="155" r="2.5" fill="rgba(255,255,255,0.6)" />
          <circle cx="100" cy="158" r="2.5" fill="rgba(255,255,255,0.6)" />
          <circle cx="115" cy="155" r="2.5" fill="rgba(255,255,255,0.6)" />
        </svg>
      </div>
      <span class="navbar-title">NotesHub</span>
    </a>
  </nav>
  <div class="content-wrapper">
  <h1>Create Note!</h1>
  <form>
    <label for="title">Title:</label>
    <input type="text" id="title" name="title" required>
    <label for="body">Body:</label>
    <textarea id="body" name="body" rows="4" required></textarea>
    <label for="sub">Sub:</label>
    <input type="text" id="sub" name="sub" required>
    <input type="submit" value="Add">
    <a href="./notes.html" id="note"> View Notes </a>
  </div></form>
  
</body>
<script>
  const note = document.getElementById("note")
  const form = document.querySelector("form");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const payload = {
      title: document.getElementById("title").value,
      body: document.getElementById("body").value,
      sub: document.getElementById("sub").value,
    };
    console.log(payload);
    fetch("http://localhost:4500/notes/add", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": localStorage.getItem("token")
      },
      body: JSON.stringify(payload),
    })
      .then((res) => res.json())
      .then((res) => {
        alert("Note added successfully!");
        note.style.display = 'inline-block'
        form.reset();
      })
      .catch((err) => console.log(err));
  });
</script>

</html>
