<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Create Note</title>
</head>

<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="navbar-logo">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
          <defs>
            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1" />
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" />
          <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
          <rect x="55" y="45" width="90" height="110" rx="8" fill="white" opacity="0.95" />
          <rect x="55" y="45" width="6" height="110" rx="3" fill="#06b6d4" />
          <line x1="70" y1="65" x2="125" y2="65" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" />
          <line x1="70" y1="80" x2="135" y2="80" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
          <line x1="70" y1="92" x2="135" y2="92" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
          <line x1="70" y1="104" x2="135" y2="104" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
          <line x1="70" y1="116" x2="120" y2="116" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
          <line x1="70" y1="128" x2="130" y2="128" stroke="#d1d5db" stroke-width="2.5" stroke-linecap="round" />
          <g transform="translate(140, 55)">
            <rect x="-8" y="0" width="6" height="35" rx="2" fill="#06b6d4" />
            <polygon points="0,35 -6,45 6,45" fill="#06b6d4" />
            <rect x="-9" y="-5" width="8" height="6" rx="1" fill="#7c3aed" />
          </g>
          <circle cx="85" cy="155" r="2.5" fill="rgba(255,255,255,0.6)" />
          <circle cx="100" cy="158" r="2.5" fill="rgba(255,255,255,0.6)" />
          <circle cx="115" cy="155" r="2.5" fill="rgba(255,255,255,0.6)" />
        </svg>
      </div>
      <span class="navbar-title">NotesHub</span>
    </a>
  </nav>
  <div class="content-wrapper">
  <h1>Create Note!</h1>
  <form>
    <label for="title">Title:</label>
    <input type="text" id="title" name="title" required>
    <label for="body">Body:</label>
    <textarea id="body" name="body" rows="4" required></textarea>
    <label for="sub">Sub:</label>
    <input type="text" id="sub" name="sub" required>
    <input type="submit" value="Add">
    <a href="./notes.html" id="note"> View Notes </a>
  </div></form>
  
</body>
<script>
  const note = document.getElementById("note")
  const form = document.querySelector("form");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const payload = {
      title: document.getElementById("title").value,
      body: document.getElementById("body").value,
      sub: document.getElementById("sub").value,
    };
    console.log(payload);
    fetch("http://localhost:4500/notes/add", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": localStorage.getItem("token")
      },
      body: JSON.stringify(payload),
    })
      .then((res) => res.json())
      .then((res) => {
        alert("Note added successfully!");
        note.style.display = 'inline-block'
        form.reset();
      })
      .catch((err) => console.log(err));
  });
</script>

</html>
